<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta-Skelter Delta Lake Health Checker</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-2: #22d3ee;
      --text: #0f172a;
      --muted: #475569;
      --border: #d7deea;
      --danger: #dc2626;
      --success: #059669;
      --mono: 'Fira Code', Menlo, Consolas, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 18% 18%, rgba(37,99,235,0.08), transparent 30%),
          radial-gradient(circle at 82% 12%, rgba(34,211,238,0.10), transparent 28%),
          radial-gradient(circle at 50% 80%, rgba(15,23,42,0.05), transparent 45%),
          var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .shell {
      width: min(1100px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.12);
      padding: 28px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.2px;
    }
    .title-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1.1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(37,99,235,0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
    }
    .pill svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    form {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    label {
      font-size: 13px;
      color: var(--muted);
    }
    input, button, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fdfefe;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.18);
    }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #f8fafc;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(37,99,235,0.25);
    }
    .demo-btn {
      background: #f8fafc;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-weight: 600;
      box-shadow: none;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
    }
    .demo-btn:hover {
      background: #eef2ff;
      color: var(--accent);
      transform: translateY(-1px);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fdfefe;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 80px;
    }
    .card h4 { margin: 0 0 6px 0; font-size: 14px; color: var(--muted); }
    .card .value { font-size: 22px; font-weight: 700; }
    .log {
      background: #fdfefe;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-height: 280px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
      color: var(--text);
    }
    .error { color: var(--danger); }
    .success { color: var(--success); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2563eb" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
              </linearGradient>
            </defs>
            <path d="M8 50 L32 10 L56 50 Z" fill="url(#grad)" opacity="0.92"/>
            <path d="M14 46 C22 42, 30 44, 38 40 C46 36, 52 38, 56 42" stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="title-stack">
          <div class="title">Delta-Skelter</div>
          <div class="subtitle">Delta Lake Health Checker</div>
        </div>
      </div>
      <div class="pill">API-backed •
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 16.5c0-2.5 1.9-4.6 4.3-4.9C8.8 8.3 10.9 6 13.5 6 16.5 6 19 8.6 19 11.7c1.7.3 3 1.8 3 3.6 0 2-1.6 3.7-3.6 3.7H7.6C5.6 19 4 17.4 4 15.5Z" fill="#2563eb" opacity="0.22"/>
          <path d="M9.5 10.5 12.5 7l3 3.5-2.3 2.6L17 17h-4l-1.7-1.9-1.7 1.9H5l4.2-4.4-1.9-2.1Z" fill="#2563eb"/>
        </svg>
        ADLS</div>
    </header>
    <form id="form">
      <div>
        <label>ADLS Delta path</label>
        <input id="path" name="path" placeholder="abfss://fs@account.dfs.core.windows.net/table/" required />
      </div>
      <div class="grid">
        <div>
          <label>Client ID (optional, defaults to UAMI)</label>
          <input id="clientId" name="clientId" placeholder="UAMI client id" />
        </div>
        <div>
          <label>Timeout (seconds, default 300)</label>
          <input id="timeout" name="timeout" type="number" min="10" value="300" />
        </div>
      </div>
      <button type="submit">Analyze</button>
    </form>
    <div style="margin-bottom:16px;">
      <div style="font-weight:600; margin-bottom:8px;">Demo scenarios (local data)</div>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <button type="button" class="demo-btn" data-profile="very-well-housekept">Awesome</button>
        <button type="button" class="demo-btn" data-profile="quite-well-housekept">Passable</button>
        <button type="button" class="demo-btn" data-profile="extremely-poorly-housekept">Miserable</button>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h4>Health Score</h4><div class="value" id="healthScore">–</div></div>
      <div class="card"><h4>Total Files</h4><div class="value" id="totalFiles">–</div></div>
      <div class="card"><h4>Total Size (MB)</h4><div class="value" id="totalSize">–</div></div>
      <div class="card"><h4>Metadata Files</h4><div class="value" id="metaFiles">–</div></div>
    </div>
    <div class="log" id="log">Awaiting analysis…</div>
  </div>
  <script>
    const form = document.getElementById('form');
    const logEl = document.getElementById('log');
    const healthEl = document.getElementById('healthScore');
    const totalFilesEl = document.getElementById('totalFiles');
    const totalSizeEl = document.getElementById('totalSize');
    const metaFilesEl = document.getElementById('metaFiles');

    const fmtMB = (n) => n === undefined ? '–' : Number(n).toFixed(2);

    const applyReportToUI = (data) => {
      healthEl.textContent = data.health_score !== undefined ? (data.health_score * 100).toFixed(1) + '%' : '–';
      totalFilesEl.textContent = data.metrics?.total_files ?? '–';
      totalSizeEl.textContent = fmtMB(data.metrics?.total_size_bytes ?? 0);
      metaFilesEl.textContent = data.metrics?.metadata_health?.metadata_file_count ?? '–';
      logEl.textContent = JSON.stringify(data, null, 2);
      logEl.classList.remove('error');
      logEl.classList.add('success');
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      logEl.textContent = 'Running analysis…';

      const body = {
        path: document.getElementById('path').value.trim(),
        client_id: document.getElementById('clientId').value.trim() || undefined,
        timeout_seconds: parseInt(document.getElementById('timeout').value, 10) || 300,
      };

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`API error ${res.status}: ${txt}`);
        }
        const data = await res.json();
        applyReportToUI(data);
      } catch (err) {
        logEl.textContent = err.message;
        logEl.classList.add('error');
      }
    });

    document.querySelectorAll('.demo-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        logEl.textContent = 'Loading demo scenario…';
        const profile = btn.dataset.profile;
        try {
          const res = await fetch(`/api/demo/${profile}`);
          if (!res.ok) {
            const txt = await res.text();
            throw new Error(`API error ${res.status}: ${txt}`);
          }
          const data = await res.json();
          applyReportToUI(data);
        } catch (err) {
          logEl.textContent = err.message;
          logEl.classList.add('error');
        }
      });
    });
  </script>
</body>
</html>

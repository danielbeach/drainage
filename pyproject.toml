[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-skelter"
version = "0.0.1"
description = "Data lake health analyzer for Delta Lake on ADLS (Python-only)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["data-lake", "delta-lake", "adls", "analytics", "data-engineering"]
authors = [
    { name = "Daniel Beach", email = "daniel@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]

dependencies = [
    "azure-identity>=1.12.0",
    "azure-storage-file-datalake>=12.6.0"
]

[project.urls]
Homepage = "https://github.com/moolahlah/delta-skelter"
Repository = "https://github.com/moolahlah/delta-skelter"
Documentation = "https://github.com/moolahlah/delta-skelter#readme"
Issues = "https://github.com/moolahlah/delta-skelter/issues"

